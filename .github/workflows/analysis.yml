name: Research Analysis & Report Generation

on:
  # Run weekly after scans
  schedule:
    - cron: '30 5 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run statistical analysis
      run: |
        cd research
        python analyze_study.py

    - name: Generate reports
      run: |
        python -c "
        from research.analyze_study import *
        import json
        from pathlib import Path
        
        # Load dataset
        dataset_path = Path('research/dataset.json')
        if dataset_path.exists():
            with open(dataset_path) as f:
                data = json.load(f)
            print(f'Analyzing {len(data)} organizations...')
            # Reports are generated by analyze_study.py
        "

    - name: Create summary
      run: |
        python -c "
        import json
        from datetime import datetime
        
        summary = {
          'generated_at': datetime.utcnow().isoformat(),
          'status': 'analysis_complete',
          'note': 'See detailed reports in research/ directory'
        }
        with open('research/summary_latest.json', 'w') as f:
          json.dump(summary, f, indent=2)
        "

    - name: Upload analysis artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: research-analysis
        path: research/
        retention-days: 90

    - name: Commit and push analysis
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff-index --quiet HEAD || git commit -m "Automated research analysis - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git push
      if: github.event_name == 'schedule'

    - name: Post summary to actions
      run: |
        echo "## Research Analysis Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See artifacts for detailed reports" >> $GITHUB_STEP_SUMMARY
